name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'rust/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/apk.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'rust/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;25.0.8775105"

      - name: Build and check the debug APK
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Verify the APK includes the native chat core
        run: |
          entries=$(unzip -Z1 app/build/outputs/apk/debug/*.apk)
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fx "lib/$abi/libtwire_core.so" <<< "$entries"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwireV2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
